          """

          def download(entry):
              digest, filename = entry.split(maxsplit=1)
              for delay in (0, 1, 3):
                  if delay:
                      sleep(delay)
                  try:
                      headers = {"Accept-Encoding": "identity", "Cache-Control": "no-cache"}
                      with urlopen(Request(source + filename, headers=headers), timeout=35) as response:
                          data = response.read()
                      if sha256(data).hexdigest() != digest:
                          raise ValueError("File differs from the verified invitation")
                      return filename, data
                  except (OSError, ValueError) as error:
                      last_error = error
              raise RuntimeError(f"Could not import {filename}: {last_error}")

          if Path("index.html").exists():
              raise SystemExit("The invitation is already in this repository")

          with ThreadPoolExecutor(max_workers=8) as pool:
              downloaded = list(pool.map(download, manifest.strip().splitlines()))
          for filename, data in downloaded:
              target = Path(filename)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          Path(".nojekyll").touch()
          print(f"Imported and verified {len(downloaded)} invitation files.")
