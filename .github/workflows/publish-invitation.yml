name: Publish graduation invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out invitation
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the invitation folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./ones-graduation-github-pages
      - name: Publish the invitation
        id: deployment
        uses: actions/deploy-pages@v4
